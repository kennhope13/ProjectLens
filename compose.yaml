services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectlens}
      POSTGRES_USER: ${POSTGRES_USER:-projectlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectlens}:${POSTGRES_PASSWORD:-projectlens}@db:5432/${POSTGRES_DB:-projectlens}
      OLLAMA_BASE_URL: http://ollama:11434
      PROJECTLENS_LLM_MODEL: qwen3:8b
    volumes:
      - ./documents:/app/documents:ro
      - ./data:/app/data
    stdin_open: true
    tty: true
    command: ["python", "-m", "project_lens.retrieval.local_ollama_rag"]

volumes:
  ollama_models:
  postgres_data:
